# The GitHub copy of the full local gate. Every step calls a reviewed body under
# ci\ rather than restating its command list, so the two records cannot drift
# apart. No ROM is needed: the integration member is the one ROM-free member of
# the ROM-gated directory, and the canonical image stays off the runner.
name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    name: gate
    runs-on: windows-latest
    # The same ten steps measured 776 s to 1808 s on an 8-core desktop; 90
    # minutes bounds a hang and leaves room for a slower runner.
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      # The suite compares tracked text bytes, so the checkout must be the
      # committed bytes.
      - name: Make the checkout preserve the committed line endings
        run: |
          git config --global core.autocrlf false
          $autocrlf = git config --get core.autocrlf
          if ($autocrlf -ne "false") { throw "the checkout would convert line endings: core.autocrlf reads $autocrlf, not false" }

      - name: Check out the repository without keeping a credential
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # tests/unit/test_local_ci_script.py diffs 34da2e67..HEAD, which a shallow clone cannot resolve.
          fetch-depth: 0
          persist-credentials: false

      # A document that arrived as CRLF byte-compares unequal to what the
      # renderer writes, for a reason that has nothing to do with the change.
      - name: Prove the checkout kept the committed bytes
        run: |
          $ledger = "docs/research/ROM_EDITOR_COVERAGE_LEDGER.md"
          $text = Get-Content -Raw -Path $ledger
          if ($text.Contains([char]13)) { throw "$ledger carries CR characters: the checkout converted line endings" }
          Write-Host "$ledger is CR-free at $($text.Length) characters"

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # A local clone hardlinks its objects, which fails across volumes, and
      # pytest's temporary root follows TMP and TEMP.
      - name: Put the temporary root on the checkout's volume
        run: |
          $volume = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          if (-not $volume) { throw "GITHUB_WORKSPACE names no volume, so the temporary root cannot share it" }
          $root = Join-Path $volume "tmp"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$root"
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$root"
          Write-Host "temporary root $root, on the volume of $env:GITHUB_WORKSPACE"

      - name: Build the SDK environment, run the portable suite and the quality gates
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\steps | Out-Null
          & powershell -NoProfile -ExecutionPolicy Bypass -File ci\test_sdk.ps1 2> artifacts\steps\01-test-sdk.err | Tee-Object -FilePath artifacts\steps\01-test-sdk.out
          if ($LASTEXITCODE -ne 0) { throw "test_sdk failed with exit $LASTEXITCODE" }

      - name: Run the ROM-free integration member
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\steps | Out-Null
          & powershell -NoProfile -ExecutionPolicy Bypass -File ci\test_integration.ps1 2> artifacts\steps\02-test-integration.err | Tee-Object -FilePath artifacts\steps\02-test-integration.out
          if ($LASTEXITCODE -ne 0) { throw "test_integration failed with exit $LASTEXITCODE" }

      - name: Run the adjacency set in both orders
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\steps | Out-Null
          # The forward exit code is carried: an exit here would skip the reverse
          # order, and either order failing must fail the job.
          & powershell -NoProfile -ExecutionPolicy Bypass -File ci\adjacency.ps1 -Order forward 2> artifacts\steps\03-adjacency-forward.err | Tee-Object -FilePath artifacts\steps\03-adjacency-forward.out
          $forward = $LASTEXITCODE
          & powershell -NoProfile -ExecutionPolicy Bypass -File ci\adjacency.ps1 -Order reverse 2> artifacts\steps\04-adjacency-reverse.err | Tee-Object -FilePath artifacts\steps\04-adjacency-reverse.out
          if ($forward -ne 0 -or $LASTEXITCODE -ne 0) { throw "adjacency failed with forward $forward and reverse $LASTEXITCODE" }

      - name: Publish the junit report and every step capture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-reports
          path: |
            report.xml
            artifacts/steps/
