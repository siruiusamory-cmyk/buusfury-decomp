image: node:22

stages:
  - deploy

deploy-site:
  stage: deploy
  variables:
    SITE_URL: "https://webfoot-sdk.siruiusamory.workers.dev"
    BASE_PATH: "/"
    CLOUDFLARE_ACCOUNT_ID: "ff3bf4332547a755ec1c5a344ab15f33"
  before_script:
    - npm ci
  script:
    - npm run check
    - npm run build
    - npx --yes wrangler@4.105.0 deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
