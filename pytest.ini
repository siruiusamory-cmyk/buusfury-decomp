[pytest]
testpaths = tests
# Keep every pytest artifact inside build/ (gitignored). The system temp
# directory on the development machine has broken ACLs for pytest's own
# pytest-of-<user> root, so tests/conftest.py also redefines the tmp fixtures.
cache_dir = build/.pytest_cache
addopts = -ra
filterwarnings =
    error::DeprecationWarning:buusfury.*
