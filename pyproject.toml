[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webfoot-toolchain"
version = "0.1.0"
description = "Safe ROM-identification infrastructure for Webfoot GBA research"
readme = "README.md"
requires-python = ">=3.12"
license = "MPL-2.0"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
dependencies = [
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
    "pip==26.2.1",
    "pytest==8.4.2",
    # The test entry point and the test-sdk CI job run the portable gate on
    # worker processes at module granularity: the slowest modules are dominated
    # by per-module decode setup, so processes buy wall clock at an identical
    # test count.
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
    "setuptools==84.0.0",
    # Property tests for the pure binary invariants of the write path. Pure
    # Python, no build step, imported only by the modules that use it.
    "hypothesis==6.143.0",
]
workbench = [
    # Pinned, and the reason is measured rather than assumed. Unpinned, the suite job
    # took 6.12.0 and `tests/unit/test_text_tool_list.py` under `-n 4 --dist
    # loadfile` died in a native abort in 8 of 12 attempts (`Fatal Python error:
    # Aborted`, no Python frame); 6.11.2 is 0 of 12 on the same command. That is a
    # narrower window, not a cure: a job on 6.11.2 has also died on a loaded runner,
    # so this is a measured improvement and nothing more.
    "PySide6==6.11.2",
]
research = [
    # The Thumb decoder the disassembly helpers and the UI/HUD graphics probe
    # sweep with. It is research tooling rather than a runtime dependency of the
    # shipping toolkit, so it lives in its own extra instead of the base
    # install - but the three capstone modules under tests/unit skip as a whole
    # without it, so the CI test job installs this extra by name.
    "capstone>=5",
]
packaging = [
    # Must match `workbench`: a frozen build that resolved the aborting version
    # would ship the crash even while the test job is clean.
    "PySide6==6.11.2",
    "pyinstaller>=6",
]

[project.scripts]
webfoot = "tools.webfoot.cli:main"
# The product's own entry point. It pointed at the beta workbench, which is the
# engineering surface rather than what a user installs; `python -m
# tools.webfoot.workbench` stays the beta's launch path.
dragonbyte-z = "tools.dragonbyte.app:main"
# The text editor's entry point, in the same style: the package's own `main`, which
# `python -m tools.buufury_text` and the frozen build both reach.
buufury-text = "tools.buufury_text.app:main"

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.setuptools.package-data]
"tools.webfoot.data" = ["roms.yaml"]

[tool.pytest.ini_options]
addopts = "-ra --timeout=120 --timeout-method=thread"
testpaths = ["tests"]
# Focused validation gates, assigned to every test from tests/gates.py and
# documented in docs/testing.md. `-m fast` is the portable gate; `-m rom` is
# the ROM-gated one; the rest cut across by subsystem.
markers = [
    "fast: portable, deterministic tests under tests/unit; the default gate",
    "workbench: DragonByte Z Workbench UI, session and editor regressions",
    "writer: authored-image, provenance, allocation and output-safety tests",
    "map: map reading, placement, rendering and layout regressions",
    "research: research and runtime tooling tests",
    "rom: tests that need a canonical local ROM image (tests/integration)",
]
# Build and extract tests write whole 8 MB ROMs and thousands of sprite PNGs
# into `tmp_path`. pytest's defaults (policy "all", count 3) keep those for
# three *basetemp roots*, so a run under a fresh TEMP never collects the
# previous one: 3,484 orphaned ROMs and 1.25M PNGs reached 17 GB before this
# was set. Keep only what diagnosing a failure actually needs.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 3
