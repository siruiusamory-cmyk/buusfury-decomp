stages:
  - test
  - deploy

# Portable SDK validation. The shipping product is `tools/webfoot/`, and its
# unit suite is synthetic-fixture only: no commercial ROM is required, and the
# ROM-gated integration tests are not collected here at all.
#
# This job is the `fast` gate of docs/testing.md (`python -m pytest -m fast`).
# It is the whole portable suite, and it runs that suite across pytest-xdist
# worker processes inside this one job. Parallel *workers* are not parallel
# *jobs*, which is what the earlier argument here was against: splitting this
# gate into several jobs would cost more in runner setup than it saves and would
# split one gate across several logs and several JUnit reports, making a failure
# harder to read rather than easier. Worker processes inside the job repeat
# neither the runner setup nor the install, and pytest still emits one merged
# `report.xml` for the merge request, so the same reasoning now supports the
# fan-out instead of forbidding it. `--dist loadfile` keeps a module on one
# worker, because the modules that dominate this suite are dominated by
# per-module decode setup rather than by the tests themselves.
#
# The shipping GUI dependency set is installed in *this* job rather than in a
# second, PySide6-only job, for the same reason: the portable suite is one job,
# a second job would repeat the runner setup and split one gate across two logs,
# and installing the extras the shipping tests import in the existing test job
# is the bounded fix. What it must not be is a job that installs only `.[dev]`
# and reports green over a Workbench surface that collapsed to skips, which is
# what it did before.
#
# The whole unit suite runs unmodified, including the git-backed
# repository-safety tests, hence the git install below.
test-sdk:
  stage: test
  image: python:3.12-slim
  variables:
    # Do not inherit the deployment credential into a test job.
    CLOUDFLARE_API_TOKEN: ""
    # The runner has no display. Twelve of the fifteen PySide6 modules the job
    # must execute set this themselves; tests/unit/test_build_panel_guard.py,
    # tests/unit/test_build_panel_overwrite.py and
    # tests/unit/test_workbench_build_manifest.py do not. The last two build a
    # real QApplication in a module-scoped fixture, so the job-level setting is
    # what makes them run headlessly instead of aborting in the Qt platform
    # plugin; the first only imports a module that imports PySide6 at module
    # scope, so it needs the dependency but constructs no widget.
    QT_QPA_PLATFORM: "offscreen"
  before_script:
    # test_project_safety.py shells out to git to prove no proprietary path is
    # tracked and that the ignore rules hold. The slim image has no git.
    #
    # PySide6 ships Qt's own shared libraries inside the wheel but not the system
    # sonames Qt links against, so the [workbench] extra imports on this image
    # only when those runtime libraries are present. THIS LIST IS THE ONE PLACE
    # TO CORRECT: if a Workbench module fails in CI with "libFoo.so.N: cannot
    # open shared object file", add the Debian package that provides that soname
    # here, with the soname in the comment. Each entry below names the DT_NEEDED
    # soname that requires it:
    #   libglib2.0-0t64   <- libglib-2.0.so.0   (libQt6Core)
    #   libgl1            <- libGL.so.1         (libQt6Gui, libQt6OpenGL)
    #   libegl1           <- libEGL.so.1        (libQt6Gui)
    #   libx11-6          <- libX11.so.6       (libQt6Gui, and libqoffscreen.so itself)
    #   libxkbcommon0     <- libxkbcommon.so.0  (libQt6Gui)
    #   libfontconfig1    <- libfontconfig.so.1 (libQt6Gui; pulls libfreetype6)
    #   libfreetype6      <- libfreetype.so.6  (libQt6Gui, libqminimal; libfontconfig1 hard-depends it, named here so the soname is explicit)
    #   libdbus-1-3       <- libdbus-1.so.3     (libQt6DBus/libQt6Core)
    # Evidence for the list above, so that it is not read as a guess. The three
    # Linux PySide6 wheels were downloaded and inspected:
    # `pyside6-6.9.3-cp39-abi3-manylinux_2_28_x86_64.whl`,
    # `pyside6_essentials-6.9.3-cp39-abi3-manylinux_2_28_x86_64.whl` (93 MiB -
    # this is the one that ships Qt) and
    # `shiboken6-6.9.3-cp39-abi3-manylinux_2_28_x86_64.whl`. Every entry above
    # was derived by parsing the ELF `DT_NEEDED` entries of
    # `PySide6/Qt/lib/libQt6Core.so.6`, `libQt6Gui.so.6`, `libQt6Widgets.so.6`,
    # `libQt6DBus.so.6`, the platform plugins
    # `plugins/platforms/libqoffscreen.so` and `libqminimal.so`, and the
    # `QtCore/QtGui/QtWidgets.abi3.so` extension modules, verified three
    # independent ways - program headers, section headers, and a raw dynstr
    # dump - with identical results.
    # The wheels bundle `libQt6*`, `libicu*`, `libpyside6*` and `libshiboken6*`
    # only. Everything listed here is a system soname they link against and the
    # image does not already provide. `libc6`, `libstdc++6`, `libgcc-s1`,
    # `zlib1g` and `libzstd1` are already in `python:3.12-slim` and are
    # deliberately not listed.
    # Notably `libqoffscreen.so` itself links `libX11.so.6`, `libGL.so.1` and
    # `libxkbcommon.so.0`: the offscreen platform avoids the **xcb plugin** and
    # its fifteen `libxcb-*` sonames, not libX11 or libxkbcommon.
    # Fonts, `xkb-data`, `libglvnd0`/`libglx0` and `libexpat1`/`libpng16-16` are
    # deliberately NOT listed: they arrive as apt hard dependencies.
    # `libglib2.0-0t64` is the Debian trixie name: `python:3.12-slim` currently
    # resolves to trixie (verified 2026-09-25 by digest identity with
    # `3.12-slim-trixie`), where the t64 transition renamed `libglib2.0-0`, and
    # installing the old name fails the job. The base image tag is deliberately
    # not pinned to a digest, like `node:22` below: if the tag later moves to a
    # suite with different package names, the job fails loudly instead of
    # silently skipping the surface it is here to execute.
    # `ca-certificates` is not added: the official python slim image already
    # installs it, and pip verifies HTTPS against its own bundled CA store.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends
      git libglib2.0-0t64 libegl1 libgl1 libx11-6 libxkbcommon0 libfontconfig1 libfreetype6 libdbus-1-3
    - python -m pip install --quiet --upgrade pip
    # `workbench` is the shipping GUI surface and `research` is capstone: without
    # them fifteen modules under tests/unit skip as a whole.
    - python -m pip install --quiet -e ".[dev,workbench,research]"
  script:
    # Size the worker count from what THIS runner actually has, because the
    # shared small runner reports 2 cores and four workers on two cores bought
    # nothing: measured 2026-10-11, the job took 237s and 252s under `-n 4`
    # against 216s to 287s for the serial master baseline, which is inside the
    # noise. `-n auto` is pytest-xdist's own reading of the core count, so the
    # sizing cannot drift from this comment. The count is printed explicitly
    # because the job runs pytest with `-q`, which suppresses the header where
    # xdist would otherwise report it. The core and memory readings stay as
    # evidence: the interpreter is used because `nproc` is not guaranteed on this
    # slim image and printed nothing when it was tried, and `/proc/meminfo` is
    # read because `free` does not exist here at all.
    - python -c "import os; print('cores:', os.cpu_count())"
    - grep -E '^(MemTotal|MemAvailable)' /proc/meminfo
    - python -c "import os; print('xdist workers (auto):', os.cpu_count())"
    # The JUnit report is what makes a failure legible in the merge request
    # without downloading the raw job log, and xdist merges every worker's
    # results into this one file.
    - python -m pytest tests/unit -q -n auto --dist loadfile --junitxml=report.xml
    # The gates a reviewer is told to run, run here as well. The unit suite does
    # exercise the public-surface and purity checks through their tests, but the
    # readability gate is only asserted over the shipping package there, so the
    # tree-wide form has to be its own step or a hard finding outside
    # `tools/webfoot/` would pass CI.
    - python -m tools.quality.public_surface --all
    - python -m tools.quality.architecture
    - python -m tools.quality.public_release
    - python -m tools.quality.readability --all
  artifacts:
    when: always
    reports:
      junit: report.xml
  rules:
    # Run on merge requests, and on branch pushes that have no open merge
    # request. The second condition suppresses the duplicate branch pipeline
    # that would otherwise run alongside every merge-request pipeline.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null'

# The public progress site is a public product surface, so its built artifact is
# validated in the test stage rather than discovered to be wrong after a deploy.
#
# Two things make this a job of its own rather than part of `test-sdk`. The
# artifact can only be judged after the site is built, which needs Node; and the
# checks read `dist/project.json`, the machine-readable copy of the status data
# the page renders, so the page and the data behind it are compared rather than
# assumed to agree. `tools/quality/site_check.py` is the same implementation a
# developer runs locally, so the two cannot drift apart.
#
# python3 is installed because the checker is standard-library Python; no
# packages are needed, and the site's own dependencies come from `npm ci`.
test-site:
  stage: test
  image: node:22
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3
    - npm ci
  script:
    # `astro check` type-checks the site source, `astro build` produces the
    # artifact, and the checker validates both the data and the artifact.
    - npm run check
    - npm run build
    - python3 tools/quality/site_check.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null'

deploy-site:
  stage: deploy
  # The one irreversible action in CI waits for the portable suite. `needs` is
  # deliberately not `optional:`, so a pipeline whose `test-sdk` was excluded by
  # its rules fails to be created rather than publishing without the suite.
  needs: ["test-sdk"]
  image: node:22
  variables:
    SITE_URL: "https://webfoot-sdk.siruiusamory.workers.dev"
    BASE_PATH: "/"
    CLOUDFLARE_ACCOUNT_ID: "ff3bf4332547a755ec1c5a344ab15f33"
  before_script:
    # The artifact check runs here as well as in `test-site`, because this job
    # can be reached without that one having run: a push to the default branch
    # while a merge request is open skips `test-site`'s condition. The check is
    # standard-library Python, so a bare interpreter is the whole dependency.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3
    - npm ci
  script:
    - npm run check
    - npm run build
    - python3 tools/quality/site_check.py
    - npx --yes wrangler@4.105.0 deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
